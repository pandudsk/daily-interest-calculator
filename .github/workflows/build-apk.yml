      - name: Use original uploaded branding images
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import shutil
          assets = Path("www/assets")
          icon_source = assets / "app-icon-original.png"
          splash_source = assets / "splash-screen-1.png"
          if not icon_source.is_file() or not splash_source.is_file():
              raise SystemExit("Original branding images are missing from www/assets")
          icon = Image.open(icon_source).convert("RGBA")
          splash = Image.open(splash_source).convert("RGB")
          if icon.size != (1024, 1024):
              raise SystemExit(f"Unexpected original app icon size: {icon.size}")
          # Preserve the uploaded icon artwork exactly for the in-app header and About section.
          shutil.copy2(icon_source, assets / "app-icon.png")
          # Preserve the complete uploaded splash artwork; only change the HTML asset reference.
          shutil.copy2(splash_source, assets / "splash-screen.png")
          # Android legacy launcher icons need an opaque square canvas. Composite the
          # original transparent logo onto the brand purple without redrawing its artwork.
          canvas = Image.new("RGBA", (1024, 1024), "#6D35B5")
          artwork = icon.copy()
          artwork.thumbnail((920, 920), Image.Resampling.LANCZOS)
          canvas.alpha_composite(artwork, ((1024-artwork.width)//2, (1024-artwork.height)//2))
          root = Path("android/app/src/main/res")
          for density, pixels in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              folder = root / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)
              resized = canvas.resize((pixels,pixels), Image.Resampling.LANCZOS)
              resized.save(folder / "ic_launcher.png", format="PNG", optimize=True)
              resized.save(folder / "ic_launcher_round.png", format="PNG", optimize=True)
          (root / "drawable").mkdir(parents=True, exist_ok=True)
          canvas.resize((432,432), Image.Resampling.LANCZOS).save(root / "drawable/ic_launcher_full.png", format="PNG", optimize=True)
          # Android 8+ adaptive icon artwork, centered inside the launcher safe zone.
          foreground = Image.new("RGBA", (1024,1024), (0,0,0,0))
          mark = icon.copy()
          mark.thumbnail((660,660), Image.Resampling.LANCZOS)
          foreground.alpha_composite(mark, ((1024-mark.width)//2, (1024-mark.height)//2))
          nodpi = root / "drawable-nodpi"
          nodpi.mkdir(parents=True, exist_ok=True)
          foreground.save(nodpi / "ic_launcher_foreground.png", format="PNG", optimize=True)
          adaptive = root / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background" /><foreground android:drawable="@drawable/ic_launcher_foreground" /></adaptive-icon>'
          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)
          PY
          npx cap copy android

      - name: Enforce Android launcher icon resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          res = Path("android/app/src/main/res")
          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text("""<resources>
            <color name="ic_launcher_background">#6D35B5</color>
          </resources>
          """)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          app_match = re.search(r"<application[^>]*>", text)
          if not app_match:
              raise SystemExit("Android application tag not found; cannot safely set launcher icon.")
          tag = app_match.group(0)
          tag = re.sub(r'\s+android:icon="[^"]*"', "", tag)
          tag = re.sub(r'\s+android:roundIcon="[^"]*"', "", tag)
          tag = tag[:-1] + ' android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round">'
          text = text[:app_match.start()] + tag + text[app_match.end():]
          manifest.write_text(text)

          for name in ("ic_launcher.xml", "ic_launcher_round.xml"):
              path = res / "mipmap-anydpi-v26" / name
              if not path.is_file():
                  raise SystemExit(f"Adaptive launcher icon missing: {path}")
          for density in ("mdpi", "hdpi", "xhdpi", "xxhdpi", "xxxhdpi"):
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  path = res / f"mipmap-{density}" / name
                  if not path.is_file() or path.stat().st_size < 100:
                      raise SystemExit(f"Launcher PNG missing or invalid: {path}")
          print("Verified legacy PNG, adaptive icon XML, background color and manifest references.")
          PY

