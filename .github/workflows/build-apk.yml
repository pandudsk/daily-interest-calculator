          values = root / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text('<resources><color name="ic_launcher_background">#6D35B5</color></resources>')
          manifest = Path("android/app/src/main/AndroidManifest.xml")
