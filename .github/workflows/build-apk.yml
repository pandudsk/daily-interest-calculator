name: Build Daily Khata Book Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, release/v1.3-audit-share-print, v1.20-development, ui/design-6-navigation, feature/logo-cloud-backup, recovery/read-only-storage-key-rescue ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Bundle Firebase Authentication bridge
        run: npx esbuild src/firebase-auth.js --bundle --format=esm --outfile=www/firebase-auth.bundle.js

      - name: Bundle local file storage bridge
        run: npx esbuild src/file-storage.js --bundle --format=iife --outfile=www/file-storage.bundle.js

      - name: Bundle native backup bridge
        run: npx esbuild src/native-backup.js --bundle --format=iife --global-name=NativeBackupBundle --outfile=www/native-backup.bundle.js

      - name: Bundle native statement share bridge
        run: npx esbuild src/native-share.js --bundle --format=iife --global-name=NativeShareBundle --outfile=www/native-share.bundle.js

      - name: Bundle native print bridge
        run: npx esbuild src/native-print.js --bundle --format=iife --global-name=NativePrintBundle --outfile=www/native-print.bundle.js
      - name: Bundle native document reminders
        run: npx esbuild src/native-reminders.js --bundle --format=iife --global-name=NativeRemindersBundle --outfile=www/native-reminders.bundle.js

      - name: Bundle native Android App Lock bridge
        run: npx esbuild src/native-app-lock.js --bundle --format=iife --outfile=www/native-app-lock.bundle.js

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure Firebase Android SDK
        run: |
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          text = root.read_text()
          classpath = "classpath 'com.google.gms:google-services:4.4.2'"
          if classpath not in text:
              if "dependencies {" in text:
                  text = text.replace("dependencies {", "dependencies {\n        " + classpath, 1)
              else:
                  text = "buildscript {\n    dependencies {\n        " + classpath + "\n    }\n}\n\n" + text
              root.write_text(text)
          app = Path("android/app/build.gradle")
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text += "\napply plugin: 'com.google.gms.google-services'\n"
              app.write_text(app_text)
          PY

      - name: Register native Android PrintManager plugin
        run: |
          mkdir -p android/app/src/main/java/com/dintakurthi/dailyinterest
          cat > android/app/src/main/java/com/dintakurthi/dailyinterest/MainActivity.java <<'EOF'
          package com.dintakurthi.dailyinterest;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativePrintPlugin.class);
                  registerPlugin(NativeBackupDownloadsPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          cat > android/app/src/main/java/com/dintakurthi/dailyinterest/NativePrintPlugin.java <<'EOF'
          package com.dintakurthi.dailyinterest;
          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "NativePrint")
          public class NativePrintPlugin extends Plugin {
              private WebView printWebView;
              @PluginMethod
              public void print(PluginCall call) {
                  final String html = call.getString("html");
                  final String title = call.getString("title", "Daily Interest Statement");
                  final String paper = call.getString("paperSize", "A4");
                  if (html == null || html.trim().isEmpty()) {
                      call.reject("Print content is empty");
                      return;
                  }
                  getActivity().runOnUiThread(() -> {
                      try {
                          PrintManager manager = (PrintManager) getContext().getSystemService(Context.PRINT_SERVICE);
                          if (manager == null) { call.reject("Android Print Service is unavailable"); return; }
                          printWebView = new WebView(getContext());
                          printWebView.setBackgroundColor(android.graphics.Color.WHITE);
                          printWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  try {
                                      PrintAttributes.MediaSize media = PrintAttributes.MediaSize.ISO_A4;
                                      if ("58mm".equals(paper)) media = new PrintAttributes.MediaSize("THERMAL_58", "58mm Thermal", 2280, 100000);
                                      else if ("80mm".equals(paper)) media = new PrintAttributes.MediaSize("THERMAL_80", "80mm Thermal", 3150, 100000);
                                      PrintAttributes attributes = new PrintAttributes.Builder()
                                          .setMediaSize(media)
                                          .setResolution(new PrintAttributes.Resolution("daily_interest", "Default", 300, 300))
                                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                          .build();
                                      manager.print(title, view.createPrintDocumentAdapter(title), attributes);
                                      call.resolve();
                                  } catch (Exception ex) { call.reject("Unable to open Android print dialog", ex); }
                              }
                          });
                          printWebView.loadDataWithBaseURL("https://localhost/", html, "text/html", "UTF-8", null);
                      } catch (Exception ex) { call.reject("Unable to start Android printing", ex); }
                  });
              }
          }
          EOF
          cat > android/app/src/main/java/com/dintakurthi/dailyinterest/NativeBackupDownloadsPlugin.java <<'JAVA'
          package com.dintakurthi.dailyinterest;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;
          @CapacitorPlugin(name="NativeBackupDownloads")
          public class NativeBackupDownloadsPlugin extends Plugin {
            @PluginMethod public void openKhataFolder(PluginCall call) {
              try {
                if (Build.VERSION.SDK_INT < 29) throw new Exception("Opening the shared Daily Khata Book folder requires Android 10 or later.");
                android.content.Intent intent = new android.content.Intent(android.content.Intent.ACTION_OPEN_DOCUMENT_TREE);
                intent.addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION);
                intent.addFlags(android.content.Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                intent.addFlags(android.content.Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
                if (Build.VERSION.SDK_INT >= 26) {
                  Uri initial = android.provider.DocumentsContract.buildTreeDocumentUri(
                    "com.android.externalstorage.documents", "primary:Download/Daily Khata Book");
                  intent.putExtra(android.provider.DocumentsContract.EXTRA_INITIAL_URI, initial);
                }
                getActivity().startActivityForResult(intent, 7842);
                JSObject result = new JSObject();
                result.put("opened", true);
                result.put("note", "Android folder picker opened at the Daily Khata Book location. Confirm the folder in the system picker.");
                call.resolve(result);
              } catch (Exception e) {
                call.reject("Could not open Daily Khata Book in Android File Manager", e);
              }
            }
            @PluginMethod public void ensureFolderStructure(PluginCall call) {
              try {
                android.content.ContentResolver resolver=getContext().getContentResolver();
                String[] folders=new String[]{"Document","Backup/Manual","Backup/Automatic","Gallery/Bills","Gallery/UPI Screenshots","Gallery/Transaction Images"};
                for(String folder:folders){
                  String relative=Environment.DIRECTORY_DOWNLOADS+"/Daily Khata Book/"+folder;
                  String marker="Folder Info.txt";
                  String selection=MediaStore.MediaColumns.DISPLAY_NAME+"=? AND "+MediaStore.MediaColumns.RELATIVE_PATH+"=?";
                  String[] args=new String[]{marker,relative+"/"};
                  boolean exists=false;
                  try(android.database.Cursor cursor=resolver.query(MediaStore.Downloads.EXTERNAL_CONTENT_URI,new String[]{MediaStore.MediaColumns._ID},selection,args,null)){
                    exists=cursor!=null&&cursor.moveToFirst();
                  }
                  if(!exists){
                    ContentValues values=new ContentValues();
                    values.put(MediaStore.MediaColumns.DISPLAY_NAME,marker);
                    values.put(MediaStore.MediaColumns.MIME_TYPE,"application/octet-stream");
                    values.put(MediaStore.MediaColumns.RELATIVE_PATH,relative);
                    values.put(MediaStore.MediaColumns.IS_PENDING,1);
                    Uri uri=resolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI,values);
                    if(uri==null)throw new Exception("Could not create "+folder+" folder");
                    try(OutputStream out=resolver.openOutputStream(uri)){if(out==null)throw new Exception("Could not initialize "+folder+" folder");out.write(("Daily Khata Book - "+folder.replace("/", " / ")+" folder").getBytes(java.nio.charset.StandardCharsets.UTF_8));}
                    ContentValues done=new ContentValues();done.put(MediaStore.MediaColumns.IS_PENDING,0);resolver.update(uri,done,null,null);
                  }
                }
                JSObject result=new JSObject();result.put("created",true);result.put("path","Downloads/Daily Khata Book/Document, Backup/Manual, Backup/Automatic, Gallery/Bills, Gallery/UPI Screenshots, Gallery/Transaction Images");call.resolve(result);
              } catch(Exception e){call.reject("Could not create Daily Khata Book folders",e);}
            }
            @PluginMethod public void saveToDownloads(PluginCall call) {
              String filename=call.getString("filename","automatic-backup.json");
              String content=call.getString("content");
              if(content==null){call.reject("Backup content is missing");return;}
              if(Build.VERSION.SDK_INT<29){call.reject("Public Downloads backup requires Android 10 or later");return;}
              try {
                String relative=Environment.DIRECTORY_DOWNLOADS+"/Daily Khata Book/Backup/Automatic";
                android.content.ContentResolver resolver=getContext().getContentResolver();
                Uri collection=MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                String selection=MediaStore.MediaColumns.DISPLAY_NAME+"=? AND "+MediaStore.MediaColumns.RELATIVE_PATH+"=?";
                String[] args=new String[]{filename,relative+"/"};
                Uri target=null;
                try(android.database.Cursor cursor=resolver.query(collection,new String[]{MediaStore.MediaColumns._ID},selection,args,null)){
                  if(cursor!=null&&cursor.moveToFirst()) target=Uri.withAppendedPath(collection,cursor.getString(0));
                }
                if(target==null){
                  ContentValues values=new ContentValues();
                  values.put(MediaStore.MediaColumns.DISPLAY_NAME,filename);
                  values.put(MediaStore.MediaColumns.MIME_TYPE,"application/json");
                  values.put(MediaStore.MediaColumns.RELATIVE_PATH,relative);
                  values.put(MediaStore.MediaColumns.IS_PENDING,1);
                  target=resolver.insert(collection,values);
                }
                if(target==null)throw new Exception("Could not create backup file in Downloads");
                try(OutputStream out=resolver.openOutputStream(target,"wt")){
                  if(out==null)throw new Exception("Could not open backup file");
                  out.write(content.getBytes(java.nio.charset.StandardCharsets.UTF_8));out.flush();
                }
                ContentValues done=new ContentValues();done.put(MediaStore.MediaColumns.IS_PENDING,0);
                resolver.update(target,done,null,null);
                JSObject result=new JSObject();result.put("uri",target.toString());result.put("path","Downloads/Daily Khata Book/Backup/Automatic/"+filename);call.resolve(result);
              } catch(Exception e){call.reject("Could not save automatic backup to Downloads",e);}
            }
            @PluginMethod public void saveFile(PluginCall call) {
              String folder=call.getString("folder","Transactions");
              String filename=call.getString("filename","attachment.bin");
              String base64=call.getString("base64");
              String mime=call.getString("mimeType","application/octet-stream");
              if(base64==null){call.reject("File content is missing");return;}
              try {
                String relative=Environment.DIRECTORY_DOWNLOADS+"/Daily Khata Book/"+folder;
                android.content.ContentResolver resolver=getContext().getContentResolver();
                ContentValues values=new ContentValues();
                values.put(MediaStore.MediaColumns.DISPLAY_NAME,filename);
                values.put(MediaStore.MediaColumns.MIME_TYPE,mime);
                values.put(MediaStore.MediaColumns.RELATIVE_PATH,relative);
                values.put(MediaStore.MediaColumns.IS_PENDING,1);
                Uri collection=MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                String selection=MediaStore.MediaColumns.DISPLAY_NAME+"=? AND "+MediaStore.MediaColumns.RELATIVE_PATH+"=?";
                String[] args=new String[]{filename,relative+"/"};
                Uri target=null;
                try(android.database.Cursor cursor=resolver.query(collection,new String[]{MediaStore.MediaColumns._ID},selection,args,null)){
                  if(cursor!=null&&cursor.moveToFirst())target=Uri.withAppendedPath(collection,cursor.getString(0));
                }
                if(target==null)target=resolver.insert(collection,values);
                else resolver.update(target,values,null,null);
                if(target==null)throw new Exception("Could not create file in Downloads");
                try(OutputStream out=resolver.openOutputStream(target,"w")){
                  if(out==null)throw new Exception("Could not open output file");
                  out.write(android.util.Base64.decode(base64,android.util.Base64.DEFAULT));out.flush();
                }
                ContentValues done=new ContentValues();done.put(MediaStore.MediaColumns.IS_PENDING,0);
                resolver.update(target,done,null,null);
                JSObject result=new JSObject();result.put("uri",target.toString());result.put("path","Downloads/Daily Khata Book/"+folder+"/"+filename);call.resolve(result);
              } catch(Exception e){call.reject("Could not copy file into Downloads",e);}
            }
            @PluginMethod public void openBackup(PluginCall call) {
              try {
                android.content.ContentResolver resolver=getContext().getContentResolver();
                Uri collection=MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                String selection=MediaStore.MediaColumns.DISPLAY_NAME+"=? AND "+MediaStore.MediaColumns.RELATIVE_PATH+"=?";
                String[] args=new String[]{"automatic-backup.json",Environment.DIRECTORY_DOWNLOADS+"/Daily Khata Book/Backup/Automatic/"};
                Uri target=null;
                try(android.database.Cursor cursor=resolver.query(collection,new String[]{MediaStore.MediaColumns._ID},selection,args,null)){
                  if(cursor!=null&&cursor.moveToFirst())target=Uri.withAppendedPath(collection,cursor.getString(0));
                }
                if(target==null){call.reject("Automatic backup file not found in Downloads");return;}
                android.content.Intent intent=new android.content.Intent(android.content.Intent.ACTION_VIEW);
                intent.setDataAndType(target,"application/json");
                intent.addFlags(android.content.Intent.FLAG_GRANT_READ_URI_PERMISSION);
                getActivity().startActivity(android.content.Intent.createChooser(intent,"Open Daily Khata Book backup"));
                JSObject result=new JSObject();result.put("opened",true);call.resolve(result);
              } catch(Exception e){call.reject("Could not open backup file",e);}
            }
            @PluginMethod public void readDownloadsBackup(PluginCall call) {
              try {
                android.content.ContentResolver resolver=getContext().getContentResolver();
                Uri collection=MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                String selection=MediaStore.MediaColumns.DISPLAY_NAME+"=? AND "+MediaStore.MediaColumns.RELATIVE_PATH+"=?";
                String[] args=new String[]{"automatic-backup.json",Environment.DIRECTORY_DOWNLOADS+"/Daily Khata Book/Backup/Automatic/"};
                Uri target=null;
                try(android.database.Cursor cursor=resolver.query(collection,new String[]{MediaStore.MediaColumns._ID},selection,args,null)){
                  if(cursor!=null&&cursor.moveToFirst())target=Uri.withAppendedPath(collection,cursor.getString(0));
                }
                if(target==null){call.reject("Automatic backup file not found in Downloads");return;}
                StringBuilder content=new StringBuilder();
                try(java.io.InputStream in=resolver.openInputStream(target);java.io.BufferedReader reader=new java.io.BufferedReader(new java.io.InputStreamReader(in,java.nio.charset.StandardCharsets.UTF_8))){
                  String line;while((line=reader.readLine())!=null){content.append(line).append('\n');}
                }
                JSObject result=new JSObject();result.put("content",content.toString());call.resolve(result);
              } catch(Exception e){call.reject("Could not read backup file from Downloads",e);}
            }
          }
          JAVA

      - name: Add native Android PrintManager plugin
        run: |
          mkdir -p android/app/src/main/java/com/dintakurthi/dailyinterest
          cat > android/app/src/main/java/com/dintakurthi/dailyinterest/NativePrintPlugin.java <<'JAVA'
          package com.dintakurthi.dailyinterest;
          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name="NativePrint")
          public class NativePrintPlugin extends Plugin {
           @PluginMethod public void printPdf(PluginCall call) {
           final String base64=call.getString("base64","");
           final String title=call.getString("title","Daily Interest Statement");
           if(base64.isEmpty()){call.reject("PDF content is empty");return;}
           getActivity().runOnUiThread(()->{
            java.io.File source=null;
            try {
             byte[] bytes=android.util.Base64.decode(base64,android.util.Base64.DEFAULT);
             source=new java.io.File(getContext().getCacheDir(),"statement-print-"+System.currentTimeMillis()+".pdf");
             try(java.io.FileOutputStream out=new java.io.FileOutputStream(source)){out.write(bytes);}
             final java.io.File pdfFile=source;
             android.print.PrintManager pm=(android.print.PrintManager)getContext().getSystemService(Context.PRINT_SERVICE);
             android.graphics.pdf.PdfRenderer renderer=new android.graphics.pdf.PdfRenderer(android.os.ParcelFileDescriptor.open(pdfFile,android.os.ParcelFileDescriptor.MODE_READ_ONLY));
             final int pageCount=renderer.getPageCount(); renderer.close();
             android.print.PrintDocumentAdapter adapter=new android.print.PrintDocumentAdapter(){
              @Override public void onLayout(android.print.PrintAttributes oldA,android.print.PrintAttributes newA,android.os.CancellationSignal cancel,LayoutResultCallback cb,android.os.Bundle extras){
               if(cancel.isCanceled()){cb.onLayoutCancelled();return;}
               android.print.PrintDocumentInfo info=new android.print.PrintDocumentInfo.Builder(title+".pdf").setContentType(android.print.PrintDocumentInfo.CONTENT_TYPE_DOCUMENT).setPageCount(pageCount).build();
               cb.onLayoutFinished(info,true);
              }
              @Override public void onWrite(android.print.PageRange[] ranges,android.os.ParcelFileDescriptor destination,android.os.CancellationSignal cancel,WriteResultCallback cb){
               try(java.io.InputStream in=new java.io.FileInputStream(pdfFile);java.io.OutputStream out=new java.io.FileOutputStream(destination.getFileDescriptor())){
                byte[] buffer=new byte[16384];int n;while((n=in.read(buffer))>0){if(cancel.isCanceled()){cb.onWriteCancelled();return;}out.write(buffer,0,n);}out.flush();cb.onWriteFinished(new android.print.PageRange[]{android.print.PageRange.ALL_PAGES});
               }catch(Exception e){cb.onWriteFailed(e.getMessage());}
              }
             };
             pm.print(title,adapter,new android.print.PrintAttributes.Builder().setMediaSize(android.print.PrintAttributes.MediaSize.ISO_A4).setResolution(new android.print.PrintAttributes.Resolution("default","Default",300,300)).setMinMargins(android.print.PrintAttributes.Margins.NO_MARGINS).build());
             com.getcapacitor.JSObject result=new com.getcapacitor.JSObject();result.put("started",true);call.resolve(result);
            } catch(Exception e){call.reject("Unable to print PDF",e);}
           });
          }
          @PluginMethod public void print(PluginCall call) {
            final String html=call.getString("html","");
            final String title=call.getString("title","Daily Interest Statement");
            final String paper=call.getString("paperSize","A4");
            if(html.isEmpty()){call.reject("Print content is empty");return;}
            getActivity().runOnUiThread(()->{
             try {
              WebView printView=new WebView(getContext());
              printView.getSettings().setJavaScriptEnabled(false);
              printView.setWebViewClient(new WebViewClient(){
               @Override public void onPageFinished(WebView view,String url){
                PrintManager pm=(PrintManager)getContext().getSystemService(Context.PRINT_SERVICE);
                PrintAttributes.MediaSize media=PrintAttributes.MediaSize.ISO_A4;
                if("58mm".equals(paper)) media=new PrintAttributes.MediaSize("THERMAL_58","58mm Thermal",2283,11000);
                else if("80mm".equals(paper)) media=new PrintAttributes.MediaSize("THERMAL_80","80mm Thermal",3150,11000);
                PrintAttributes attrs=new PrintAttributes.Builder().setMediaSize(media).setResolution(new PrintAttributes.Resolution("default","Default",300,300)).setMinMargins(PrintAttributes.Margins.NO_MARGINS).build();
                pm.print(title,view.createPrintDocumentAdapter(title),attrs);
                JSObject result=new JSObject();result.put("started",true);call.resolve(result);
               }
              });
              printView.loadDataWithBaseURL(null,html,"text/html","UTF-8",null);
             } catch(Exception e){call.reject("Android print service failed",e);}
            });
           }
          }
