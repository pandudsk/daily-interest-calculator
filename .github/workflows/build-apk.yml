name: Build Daily Interest Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, release/v1.3-audit-share-print, v1.20-development, ui/design-6-navigation ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Bundle native backup bridge
        run: npx esbuild src/native-backup.js --bundle --format=iife --global-name=NativeBackupBundle --outfile=www/native-backup.bundle.js

      - name: Bundle native statement share bridge
        run: npx esbuild src/native-share.js --bundle --format=iife --global-name=NativeShareBundle --outfile=www/native-share.bundle.js

      - name: Bundle native print bridge
        run: npx esbuild src/native-print.js --bundle --format=iife --global-name=NativePrintBundle --outfile=www/native-print.bundle.js

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Register native Android PrintManager plugin
        run: |
          mkdir -p android/app/src/main/java/com/dintakurthi/dailyinterest
          cat > android/app/src/main/java/com/dintakurthi/dailyinterest/MainActivity.java <<'EOF'
          package com.dintakurthi.dailyinterest;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NativePrintPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF
          cat > android/app/src/main/java/com/dintakurthi/dailyinterest/NativePrintPlugin.java <<'EOF'
          package com.dintakurthi.dailyinterest;
          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name = "NativePrint")
          public class NativePrintPlugin extends Plugin {
              private WebView printWebView;
              @PluginMethod
              public void print(PluginCall call) {
                  final String html = call.getString("html");
                  final String title = call.getString("title", "Daily Interest Statement");
                  final String paper = call.getString("paperSize", "A4");
                  if (html == null || html.trim().isEmpty()) {
                      call.reject("Print content is empty");
                      return;
                  }
                  getActivity().runOnUiThread(() -> {
                      try {
                          PrintManager manager = (PrintManager) getContext().getSystemService(Context.PRINT_SERVICE);
                          if (manager == null) { call.reject("Android Print Service is unavailable"); return; }
                          printWebView = new WebView(getContext());
                          printWebView.setBackgroundColor(android.graphics.Color.WHITE);
                          printWebView.setWebViewClient(new WebViewClient() {
                              @Override
                              public void onPageFinished(WebView view, String url) {
                                  try {
                                      PrintAttributes.MediaSize media = PrintAttributes.MediaSize.ISO_A4;
                                      if ("58mm".equals(paper)) media = new PrintAttributes.MediaSize("THERMAL_58", "58mm Thermal", 2280, 100000);
                                      else if ("80mm".equals(paper)) media = new PrintAttributes.MediaSize("THERMAL_80", "80mm Thermal", 3150, 100000);
                                      PrintAttributes attributes = new PrintAttributes.Builder()
                                          .setMediaSize(media)
                                          .setResolution(new PrintAttributes.Resolution("daily_interest", "Default", 300, 300))
                                          .setMinMargins(PrintAttributes.Margins.NO_MARGINS)
                                          .build();
                                      manager.print(title, view.createPrintDocumentAdapter(title), attributes);
                                      call.resolve();
                                  } catch (Exception ex) { call.reject("Unable to open Android print dialog", ex); }
                              }
                          });
                          printWebView.loadDataWithBaseURL("https://localhost/", html, "text/html", "UTF-8", null);
                      } catch (Exception ex) { call.reject("Unable to start Android printing", ex); }
                  });
              }
          }
          EOF

      - name: Add native Android PrintManager plugin
        run: |
          mkdir -p android/app/src/main/java/com/dintakurthi/dailyinterest
          cat > android/app/src/main/java/com/dintakurthi/dailyinterest/NativePrintPlugin.java <<'JAVA'
          package com.dintakurthi.dailyinterest;
          import android.content.Context;
          import android.print.PrintAttributes;
          import android.print.PrintManager;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          @CapacitorPlugin(name="NativePrint")
          public class NativePrintPlugin extends Plugin {
           @PluginMethod public void printPdf(PluginCall call) {
           final String base64=call.getString("base64","");
           final String title=call.getString("title","Daily Interest Statement");
           if(base64.isEmpty()){call.reject("PDF content is empty");return;}
           getActivity().runOnUiThread(()->{
            java.io.File source=null;
            try {
             byte[] bytes=android.util.Base64.decode(base64,android.util.Base64.DEFAULT);
             source=new java.io.File(getContext().getCacheDir(),"statement-print-"+System.currentTimeMillis()+".pdf");
             try(java.io.FileOutputStream out=new java.io.FileOutputStream(source)){out.write(bytes);}
             final java.io.File pdfFile=source;
             android.print.PrintManager pm=(android.print.PrintManager)getContext().getSystemService(Context.PRINT_SERVICE);
             android.graphics.pdf.PdfRenderer renderer=new android.graphics.pdf.PdfRenderer(android.os.ParcelFileDescriptor.open(pdfFile,android.os.ParcelFileDescriptor.MODE_READ_ONLY));
             final int pageCount=renderer.getPageCount(); renderer.close();
             android.print.PrintDocumentAdapter adapter=new android.print.PrintDocumentAdapter(){
              @Override public void onLayout(android.print.PrintAttributes oldA,android.print.PrintAttributes newA,android.os.CancellationSignal cancel,LayoutResultCallback cb,android.os.Bundle extras){
               if(cancel.isCanceled()){cb.onLayoutCancelled();return;}
               android.print.PrintDocumentInfo info=new android.print.PrintDocumentInfo.Builder(title+".pdf").setContentType(android.print.PrintDocumentInfo.CONTENT_TYPE_DOCUMENT).setPageCount(pageCount).build();
               cb.onLayoutFinished(info,true);
              }
              @Override public void onWrite(android.print.PageRange[] ranges,android.os.ParcelFileDescriptor destination,android.os.CancellationSignal cancel,WriteResultCallback cb){
               try(java.io.InputStream in=new java.io.FileInputStream(pdfFile);java.io.OutputStream out=new java.io.FileOutputStream(destination.getFileDescriptor())){
                byte[] buffer=new byte[16384];int n;while((n=in.read(buffer))>0){if(cancel.isCanceled()){cb.onWriteCancelled();return;}out.write(buffer,0,n);}out.flush();cb.onWriteFinished(new android.print.PageRange[]{android.print.PageRange.ALL_PAGES});
               }catch(Exception e){cb.onWriteFailed(e.getMessage());}
              }
             };
             pm.print(title,adapter,new android.print.PrintAttributes.Builder().setMediaSize(android.print.PrintAttributes.MediaSize.ISO_A4).setResolution(new android.print.PrintAttributes.Resolution("default","Default",300,300)).setMinMargins(android.print.PrintAttributes.Margins.NO_MARGINS).build());
             com.getcapacitor.JSObject result=new com.getcapacitor.JSObject();result.put("started",true);call.resolve(result);
            } catch(Exception e){call.reject("Unable to print PDF",e);}
           });
          }
          @PluginMethod public void print(PluginCall call) {
            final String html=call.getString("html","");
            final String title=call.getString("title","Daily Interest Statement");
            final String paper=call.getString("paperSize","A4");
            if(html.isEmpty()){call.reject("Print content is empty");return;}
            getActivity().runOnUiThread(()->{
             try {
              WebView printView=new WebView(getContext());
              printView.getSettings().setJavaScriptEnabled(false);
              printView.setWebViewClient(new WebViewClient(){
               @Override public void onPageFinished(WebView view,String url){
                PrintManager pm=(PrintManager)getContext().getSystemService(Context.PRINT_SERVICE);
                PrintAttributes.MediaSize media=PrintAttributes.MediaSize.ISO_A4;
                if("58mm".equals(paper)) media=new PrintAttributes.MediaSize("THERMAL_58","58mm Thermal",2283,11000);
                else if("80mm".equals(paper)) media=new PrintAttributes.MediaSize("THERMAL_80","80mm Thermal",3150,11000);
                PrintAttributes attrs=new PrintAttributes.Builder().setMediaSize(media).setResolution(new PrintAttributes.Resolution("default","Default",300,300)).setMinMargins(PrintAttributes.Margins.NO_MARGINS).build();
                pm.print(title,view.createPrintDocumentAdapter(title),attrs);
                JSObject result=new JSObject();result.put("started",true);call.resolve(result);
               }
              });
              printView.loadDataWithBaseURL(null,html,"text/html","UTF-8",null);
             } catch(Exception e){call.reject("Android print service failed",e);}
            });
           }
          }
          JAVA
          cat > android/app/src/main/java/com/dintakurthi/dailyinterest/MainActivity.java <<'JAVA'
          package com.dintakurthi.dailyinterest;
          import android.os.Bundle;
          import android.graphics.Color;
          import android.view.View;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle savedInstanceState) {
              registerPlugin(NativePrintPlugin.class);
              super.onCreate(savedInstanceState);
              getWindow().clearFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);
              WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              getWindow().setStatusBarColor(Color.rgb(109, 53, 181));
              getWindow().setNavigationBarColor(Color.rgb(81, 37, 143));
              getWindow().getDecorView().setSystemUiVisibility(0);
            }
          }
          JAVA


      - name: Install Pillow for launcher icon processing
        run: python -m pip install pillow

      - name: Prepare padded launcher icon from the splash artwork
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("www/assets/splash-screen.jpg").convert("RGB")
          # Isolate the purple book + gold D + rupee coin from the top of the supplied splash.
          artwork = source.crop((65, 0, 335, 330))
          artwork.thumbnail((790, 790), Image.Resampling.LANCZOS)
          canvas = Image.new("RGB", (1024, 1024), "#6D35B5")
          canvas.paste(artwork, ((1024-artwork.width)//2, (1024-artwork.height)//2))
          canvas.save("www/assets/app-icon-padded.png", format="PNG", optimize=True)
          root = Path("android/app/src/main/res")
          for folder in ["drawable", "mipmap-mdpi", "mipmap-hdpi", "mipmap-xhdpi", "mipmap-xxhdpi", "mipmap-xxxhdpi", "mipmap-anydpi-v26", "values"]:
              (root / folder).mkdir(parents=True, exist_ok=True)
          for density, pixels in [("mdpi",48),("hdpi",72),("xhdpi",96),("xxhdpi",144),("xxxhdpi",192)]:
              icon = canvas.resize((pixels,pixels), Image.Resampling.LANCZOS)
              icon.save(root / f"mipmap-{density}/ic_launcher.png", format="PNG", optimize=True)
              icon.save(root / f"mipmap-{density}/ic_launcher_round.png", format="PNG", optimize=True)
          canvas.resize((432,432), Image.Resampling.LANCZOS).save(root / "drawable/ic_launcher_full.png", format="PNG", optimize=True)
          PY
          npx cap copy android

      - name: Set purple Android launch background
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cat > android/app/src/main/res/drawable/launch_background.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
            <item><shape android:shape="rectangle"><solid android:color="#6D35B5" /></shape></item>
          </layer-list>
          EOF
          cat > android/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.Light.DarkActionBar">
              <item name="colorAccent">#6D35B5</item>
            </style>
            <style name="AppTheme.NoActionBar" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="colorAccent">#6D35B5</item>
              <item name="android:windowBackground">@drawable/launch_background</item>
              <item name="android:statusBarColor">#6D35B5</item>
              <item name="android:navigationBarColor">#51258F</item>
            </style>
            <style name="AppTheme.NoActionBarLaunch" parent="Theme.AppCompat.Light.NoActionBar">
              <item name="android:windowBackground">@drawable/launch_background</item>
              <item name="android:statusBarColor">#6D35B5</item>
              <item name="android:navigationBarColor">#51258F</item>
            </style>
          </resources>
          EOF

      - name: Set App Version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text, count1 = re.subn(r'versionCode\s+\d+', 'versionCode 26', text, count=1)
          text, count2 = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.25"', text, count=1)

          if count1 != 1 or count2 != 1:
              raise SystemExit("Version fields not found")

          path.write_text(text)
          PY

      - name: Generate app version metadata
        run: |
          cat > www/app-version.js <<'EOF'
          window.APP_VERSION = { name: "1.25", code: 26 };
          EOF
          npx cap copy android

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/app/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/dintakurthi-release.jks
          test -s android/app/keystore/dintakurthi-release.jks
          chmod 600 android/app/keystore/dintakurthi-release.jks

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfigs {" in text:
              raise SystemExit("Signing configuration already exists; stopping safely.")

          pattern = r"(?m)^(\s*)buildTypes\s*[{]"
          match = re.search(pattern, text)

          if not match:
              raise SystemExit("Could not find buildTypes in build.gradle")

          indent = match.group(1)
          signing = (
              indent + "signingConfigs {\n"
              + indent + "    release {\n"
              + indent + '        storeFile file("keystore/dintakurthi-release.jks")\n'
              + indent + '        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
              + indent + '        keyAlias System.getenv("ANDROID_KEY_ALIAS")\n'
              + indent + '        keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
              + indent + "    }\n"
              + indent + "}\n\n"
          )

          text = text[:match.start()] + signing + text[match.start():]

          release_pattern = r"(?m)^(\s*)release\s*[{]"
          start = text.find("buildTypes")
          release_match = re.search(release_pattern, text[start:])

          if not release_match:
              raise SystemExit("Could not find release build type")

          pos = start + release_match.end()
          release_indent = release_match.group(1) + "    "
          text = (
              text[:pos]
              + "\n" + release_indent + "signingConfig signingConfigs.release"
              + text[pos:]
          )

          path.write_text(text)
          PY

      - name: Build Signed Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-interest-calculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-interest-calculator-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
