          JAVA
          cat > android/app/src/main/java/com/dintakurthi/dailyinterest/NativeAppLockPlugin.java <<'JAVA'
          package com.dintakurthi.dailyinterest;
          
          import android.app.KeyguardManager;
          import android.content.Context;
          import android.os.Build;
          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;
          import androidx.fragment.app.FragmentActivity;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          
          @CapacitorPlugin(name = "NativeAppLock")
          public class NativeAppLockPlugin extends Plugin {
              @PluginMethod
              public void checkDeviceSecurity(PluginCall call) {
                  KeyguardManager keyguard = (KeyguardManager) getContext().getSystemService(Context.KEYGUARD_SERVICE);
                  boolean secure = keyguard != null && keyguard.isDeviceSecure();
                  JSObject result = new JSObject();
                  result.put("secure", secure);
                  call.resolve(result);
              }
          
              @PluginMethod
              public void setEnabled(PluginCall call) {
                  boolean enabled = call.getBoolean("enabled", false);
                  getContext().getSharedPreferences("daily_khata_security", Context.MODE_PRIVATE)
                      .edit().putBoolean("app_lock_enabled", enabled).apply();
                  call.resolve();
              }
          
              @PluginMethod
              public void authenticate(PluginCall call) {
                  KeyguardManager keyguard = (KeyguardManager) getContext().getSystemService(Context.KEYGUARD_SERVICE);
                  if (keyguard == null || !keyguard.isDeviceSecure()) {
                      call.reject("Set a secure screen lock on this device first.");
                      return;
                  }
                  getActivity().runOnUiThread(() -> {
                      try {
                          BiometricPrompt prompt = new BiometricPrompt(
                              (FragmentActivity) getActivity(),
                              ContextCompat.getMainExecutor(getContext()),
                              new BiometricPrompt.AuthenticationCallback() {
                                  @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {
                                      call.resolve();
                                  }
                                  @Override public void onAuthenticationError(int code, CharSequence message) {
                                      call.reject(message == null ? "Authentication cancelled" : message.toString());
                                  }
                                  @Override public void onAuthenticationFailed() {
                                      // Keep the system prompt open; the user can retry fingerprint.
                                  }
                              }
                          );
                          BiometricPrompt.PromptInfo.Builder builder = new BiometricPrompt.PromptInfo.Builder()
                              .setTitle("Unlock Daily Khata Book")
                              .setSubtitle("Verify your identity to access your ledger");
                          if (Build.VERSION.SDK_INT >= 30) {
                              builder.setAllowedAuthenticators(
                                  BiometricManager.Authenticators.BIOMETRIC_STRONG |
                                  BiometricManager.Authenticators.DEVICE_CREDENTIAL
                              );
                          } else {
                              builder.setDeviceCredentialAllowed(true);
                          }
                          prompt.authenticate(builder.build());
                      } catch (Exception error) {
                          call.reject("Unable to start Android authentication.", error);
                      }
                  });
              }
          }
          
