        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/outputs/bundle/release/app-release.aab
          mkdir -p dist/store-release
          cp android/app/build/outputs/apk/release/app-release.apk dist/store-release/Daily-Khata-Book-1.44-45-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab dist/store-release/Daily-Khata-Book-1.44-45-release.aab
          sha256sum dist/store-release/* > dist/store-release/SHA256SUMS.txt
          printf 'App: Daily Khata Book\\nPackage: com.dintakurthi.dailyinterest\\nVersion: 1.44\\nVersion code: 45\\nBuild type: signed release\\nFormats: APK, AAB\\n' > dist/store-release/RELEASE-INFO.txt

      - name: Upload Store Release Package Set
        uses: actions/upload-artifact@v4
        with:
          name: daily-khata-book-store-release-v1.43-build44
          path: dist/store-release/*
          if-no-files-found: error
