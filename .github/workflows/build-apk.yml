name: Build Daily Interest Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, release/v1.3-audit-share-print ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Bundle native backup bridge
        run: npx esbuild src/native-backup.js --bundle --format=iife --global-name=NativeBackupBundle --outfile=www/native-backup.bundle.js

      - name: Bundle native statement share bridge
        run: npx esbuild src/native-share.js --bundle --format=iife --global-name=NativeShareBundle --outfile=www/native-share.bundle.js

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Android launcher icon assets
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-anydpi-v26
          rsvg-convert -w 512 -h 512 www/icon.svg > /tmp/app-icon-512.png
          rsvg-convert -w 48 -h 48 www/icon.svg > android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          rsvg-convert -w 72 -h 72 www/icon.svg > android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          rsvg-convert -w 96 -h 96 www/icon.svg > android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          rsvg-convert -w 144 -h 144 www/icon.svg > android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          rsvg-convert -w 192 -h 192 www/icon.svg > android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp /tmp/app-icon-512.png android/app/src/main/res/drawable/ic_launcher_full.png
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#6D35B5</color></resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_full" />
          </adaptive-icon>
          EOF

      - name: Apply branded Android launcher icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi android/app/src/main/res/mipmap-hdpi android/app/src/main/res/mipmap-xhdpi android/app/src/main/res/mipmap-xxhdpi android/app/src/main/res/mipmap-xxxhdpi android/app/src/main/res/mipmap-anydpi-v26 android/app/src/main/res/drawable android/app/src/main/res/values
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            pixels="$2"
            rsvg-convert -w "$pixels" -h "$pixels" www/icon.svg > "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "android/app/src/main/res/mipmap-$density/ic_launcher.png" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          rsvg-convert -w 512 -h 512 www/icon.svg > android/app/src/main/res/drawable/ic_launcher_full.png
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'EOF'
          <resources><color name="ic_launcher_background">#6D35B5</color></resources>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_full"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Set App Version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          text, count1 = re.subn(r'versionCode\s+\d+', 'versionCode 10', text, count=1)
          text, count2 = re.subn(r'versionName\s+"[^"]+"', 'versionName "1.9"', text, count=1)

          if count1 != 1 or count2 != 1:
              raise SystemExit("Version fields not found")

          path.write_text(text)
          PY

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          mkdir -p android/app/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/dintakurthi-release.jks
          test -s android/app/keystore/dintakurthi-release.jks
          chmod 600 android/app/keystore/dintakurthi-release.jks

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfigs {" in text:
              raise SystemExit("Signing configuration already exists; stopping safely.")

          pattern = r"(?m)^(\s*)buildTypes\s*[{]"
          match = re.search(pattern, text)

          if not match:
              raise SystemExit("Could not find buildTypes in build.gradle")

          indent = match.group(1)
          signing = (
              indent + "signingConfigs {\n"
              + indent + "    release {\n"
              + indent + '        storeFile file("keystore/dintakurthi-release.jks")\n'
              + indent + '        storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
              + indent + '        keyAlias System.getenv("ANDROID_KEY_ALIAS")\n'
              + indent + '        keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
              + indent + "    }\n"
              + indent + "}\n\n"
          )

          text = text[:match.start()] + signing + text[match.start():]

          release_pattern = r"(?m)^(\s*)release\s*[{]"
          start = text.find("buildTypes")
          release_match = re.search(release_pattern, text[start:])

          if not release_match:
              raise SystemExit("Could not find release build type")

          pos = start + release_match.end()
          release_indent = release_match.group(1) + "    "
          text = (
              text[:pos]
              + "\n" + release_indent + "signingConfig signingConfigs.release"
              + text[pos:]
          )

          path.write_text(text)
          PY

      - name: Build Signed Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-interest-calculator-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-interest-calculator-signed-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
